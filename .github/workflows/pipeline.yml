name: Discovery Engine Weekly Pipeline

on:
  schedule:
    # Runs every Sunday at 10:00 AM UTC
    - cron: '0 10 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit artifacts back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run Pipeline (Phase 1 to Phase 5)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          # 1. Ingestion
          python -m src.ingestion.play_store || true
          python -m src.ingestion.app_store || true
          python -m src.ingestion.youtube || true
          
          # 2. Processing
          python -m src.processing.cleaner
          python -m src.processing.relevance_filter
          python -m src.processing.chunker
          python -m src.processing.embedder
          
          # 3. AI Analysis
          python -m src.analysis.extractor
          python -m src.analysis.memory_classifier
          python -m src.analysis.gap_classifier
          python -m src.analysis.behavior_tagger
          python -m src.analysis.clusterer
          python -m src.analysis.evidence_ranker
          
          # 4. Decomposition
          python -m src.decomposition.gap_mapper
          python -m src.decomposition.scorecard
          
          # 5. Output
          python -m src.output.report_generator

      - name: Commit and push generated reports
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add data/ outputs/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update discovery insights: $(date +'%Y-%m-%d')" && git push)
